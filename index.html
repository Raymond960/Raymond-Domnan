    <!-- Security & SSL Enforcement -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="robots" content="noindex, nofollow" id="meta-robots-tag" />
    <script>
      // Automatically enforce noindex, nofollow on /admin, /dashboard, and secure paths
      if (
        window.location.pathname.startsWith('/admin') ||
        window.location.pathname.startsWith('/dashboard') ||
        window.location.pathname.startsWith('/api') ||
        window.location.hash.includes('admin')
      ) {
        var rMeta = document.getElementById('meta-robots-tag') || document.createElement('meta');
        rMeta.name = 'robots';
        rMeta.content = 'noindex, nofollow, noarchive, nosnippet';
        document.head.appendChild(rMeta);
      }
    </script>
    <script>
      // Force HTTPS on non-localhost production environments
      if (
        window.location.protocol === 'http:' &&
        window.location.hostname !== 'localhost' &&
        window.location.hostname !== '127.0.0.1' &&
        !window.location.hostname.endsWith('.internal')
      ) {
        window.location.replace('https:' + window.location.href.substring(window.location.protocol.length));
      }
    </script>
